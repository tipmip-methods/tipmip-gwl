[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tipmip-gwl"
version = "0.1.0"
description = "Re-index TIPMIP ramp-up and ramp-down output onto a common global warming level axis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "cftime",
    "netCDF4",
]

[project.optional-dependencies]
paper = ["matplotlib"]
test = ["pytest"]

[project.scripts]
tipmip-gwl-build = "tipmip_gwl.build:main"
tipmip-gwl-build-rampdown = "tipmip_gwl.build:main_rampdown"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tipmip_gwl = ["data/mappings/*.nc"]
